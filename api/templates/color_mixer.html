{% extends "base.html" %}
{% block title %}Color Mixer{% endblock %}
{% block canonical %}https://ai-code-masker.vercel.app/color-mixer{% endblock %}
{% block content %}
    <div class="h-14 border-b border-white/5 flex items-center px-8 glass shrink-0">
        <h2 class="text-xs font-black text-white tracking-[4px] uppercase">Color Mixer</h2>
    </div>
    <div class="p-8 flex flex-col gap-6 flex-grow overflow-auto">
        <div class="flex flex-wrap gap-4 items-center">
            <div class="flex items-center gap-2"><label class="text-[10px] text-slate-500 font-bold uppercase">Color 1:</label><input type="color" id="mx-c1" value="#6366f1" oninput="mix()" class="w-10 h-8 rounded cursor-pointer border-0 bg-transparent"></div>
            <div class="flex items-center gap-2"><label class="text-[10px] text-slate-500 font-bold uppercase">Color 2:</label><input type="color" id="mx-c2" value="#ec4899" oninput="mix()" class="w-10 h-8 rounded cursor-pointer border-0 bg-transparent"></div>
            <div class="flex items-center gap-2"><label class="text-[10px] text-slate-500 font-bold uppercase">Steps: <span id="v-st" class="text-indigo-400">5</span></label><input type="range" id="mx-steps" min="2" max="10" value="5" oninput="mix()" class="w-24 accent-indigo-500"></div>
        </div>
        <div id="mix-row" class="flex rounded-2xl overflow-hidden h-40 border border-white/10"></div>
        <div id="mix-codes" class="grid grid-cols-5 gap-2"></div>
    </div>
{% endblock %}
{% block scripts %}
<script>
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');}
function mix(){
    const c1=hexToRgb(document.getElementById('mx-c1').value),c2=hexToRgb(document.getElementById('mx-c2').value);
    const steps=+document.getElementById('mx-steps').value;document.getElementById('v-st').textContent=steps;
    const colors=[];for(let i=0;i<steps;i++){const t=i/(steps-1);colors.push(rgbToHex(c1.r+(c2.r-c1.r)*t,c1.g+(c2.g-c1.g)*t,c1.b+(c2.b-c1.b)*t));}
    document.getElementById('mix-row').innerHTML=colors.map(c=>`<div class="flex-1 cursor-pointer flex items-end justify-center pb-2 hover:flex-[1.5] transition-all" style="background:${c}" onclick="navigator.clipboard.writeText('${c}')"><span class="text-[9px] font-bold text-white/80 bg-black/30 px-2 py-1 rounded">${c}</span></div>`).join('');
    document.getElementById('mix-codes').style.gridTemplateColumns=`repeat(${steps},1fr)`;
    document.getElementById('mix-codes').innerHTML=colors.map(c=>`<div class="glass-card rounded-lg p-2 text-center cursor-pointer" onclick="navigator.clipboard.writeText('${c}')"><div class="w-full h-6 rounded mb-1" style="background:${c}"></div><span class="code-font text-[9px] text-slate-400">${c}</span></div>`).join('');
}
mix();
</script>
{% endblock %}

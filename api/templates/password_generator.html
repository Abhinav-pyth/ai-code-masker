{% extends "base.html" %}
{% block title %}Password Generator{% endblock %}
{% block canonical %}https://ai-code-masker.vercel.app/password-generator{% endblock %}
{% block content %}
    <div class="h-14 border-b border-white/5 flex items-center px-8 glass shrink-0">
        <h2 class="text-xs font-black text-white tracking-[4px] uppercase">Password Generator</h2>
    </div>
    <div class="p-8 flex flex-col gap-6 flex-grow overflow-auto">
        <div class="glass-card rounded-2xl p-6">
            <div class="flex items-center gap-3 mb-4">
                <input id="pw-output" readonly type="text" class="flex-grow bg-transparent text-2xl text-white outline-none code-font tracking-wider">
                <button onclick="navigator.clipboard.writeText(document.getElementById('pw-output').value)" class="px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider bg-indigo-600 text-white hover:bg-indigo-500 transition-all">Copy</button>
                <button onclick="gen()" class="px-4 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider bg-white/5 border border-white/10 text-slate-400 hover:text-white transition-all">🔄</button>
            </div>
            <div id="pw-strength" class="h-2 rounded-full bg-white/5 overflow-hidden"><div id="pw-bar" class="h-full rounded-full transition-all duration-300"></div></div>
            <div id="pw-label" class="text-[10px] font-bold uppercase tracking-wider mt-1 text-slate-500"></div>
        </div>
        <div class="glass-card rounded-2xl p-6 flex flex-col gap-4">
            <label class="text-[10px] font-black text-slate-500 uppercase">Length: <span id="v-len" class="text-indigo-400">16</span></label>
            <input type="range" id="pw-len" min="4" max="64" value="16" oninput="gen()" class="accent-indigo-500">
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase"><input type="checkbox" id="pw-upper" checked onchange="gen()" class="accent-indigo-500"> Uppercase (A-Z)</label>
                <label class="flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase"><input type="checkbox" id="pw-lower" checked onchange="gen()" class="accent-indigo-500"> Lowercase (a-z)</label>
                <label class="flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase"><input type="checkbox" id="pw-numbers" checked onchange="gen()" class="accent-indigo-500"> Numbers (0-9)</label>
                <label class="flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase"><input type="checkbox" id="pw-symbols" checked onchange="gen()" class="accent-indigo-500"> Symbols (!@#$)</label>
            </div>
        </div>
        <button onclick="genBulk()" class="px-5 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider bg-white/5 border border-white/10 text-slate-400 hover:text-white transition-all w-fit">Generate 10 Passwords</button>
        <div id="pw-bulk" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
    </div>
{% endblock %}
{% block scripts %}
<script>
function gen(){
    const len=+document.getElementById('pw-len').value;document.getElementById('v-len').textContent=len;
    let chars='';
    if(document.getElementById('pw-upper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if(document.getElementById('pw-lower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
    if(document.getElementById('pw-numbers').checked)chars+='0123456789';
    if(document.getElementById('pw-symbols').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
    if(!chars)chars='abcdefghijklmnopqrstuvwxyz';
    const arr=new Uint32Array(len);crypto.getRandomValues(arr);
    const pw=Array.from(arr,v=>chars[v%chars.length]).join('');
    document.getElementById('pw-output').value=pw;
    const entropy=Math.log2(Math.pow(chars.length,len));
    let strength,color,width;
    if(entropy<40){strength='Weak';color='bg-red-500';width='25%';}
    else if(entropy<60){strength='Fair';color='bg-amber-500';width='50%';}
    else if(entropy<80){strength='Strong';color='bg-emerald-500';width='75%';}
    else{strength='Very Strong';color='bg-indigo-500';width='100%';}
    document.getElementById('pw-bar').className=`h-full rounded-full transition-all duration-300 ${color}`;
    document.getElementById('pw-bar').style.width=width;
    document.getElementById('pw-label').textContent=`${strength} · ${Math.round(entropy)} bits entropy`;
    return pw;
}
function genBulk(){const pws=[];for(let i=0;i<10;i++)pws.push(gen());document.getElementById('pw-bulk').innerHTML=pws.map(p=>`<div class="glass-card rounded-lg p-2 flex justify-between items-center"><code class="code-font text-xs text-slate-300 truncate">${p}</code><button onclick="navigator.clipboard.writeText('${p}')" class="text-[10px] text-indigo-400 shrink-0 ml-2">Copy</button></div>`).join('');}
gen();
</script>
{% endblock %}

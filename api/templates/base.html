<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Code Masker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gradient-bg {
            background: radial-gradient(circle at 0% 0%, #1e1b4b 0%, #0c0c14 50%, #000000 100%);
            background-attachment: fixed;
        }

        .btn-premium {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -12px rgba(99, 102, 241, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .nav-active {
            background: rgba(99, 102, 241, 0.1);
            color: white;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .nav-item {
            color: rgb(148, 163, 184);
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transform: translateY(-1px);
        }

        .nav-group-label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgb(71, 85, 105);
            padding: 0.5rem 1rem;
            margin-top: 0.75rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        {% block extra_styles %}{% endblock %}

        /* Mobile nav */
        .hamburger-btn { display: none; }
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .hamburger-btn { display: flex; }
            .desktop-nav { display: none !important; }
            .mobile-nav {
                display: none;
                position: absolute;
                top: 80px;
                left: 0; right: 0;
                background: #0a0a12;
                border-bottom: 1px solid rgba(255,255,255,0.08);
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 1rem;
                z-index: 50;
            }
            .mobile-nav.open { display: flex; }
        }
    </style>
</head>

<body class="gradient-bg text-slate-200 min-h-screen flex flex-col">
    <!-- Top Navigation Header -->
    <header class="sticky top-0 h-16 glass border-b border-white/10 flex items-center justify-between px-6 md:px-10 z-[60] shrink-0">
        <div class="flex items-center space-x-4 group cursor-pointer" onclick="window.location.href='/'">
            <div class="w-10 h-10 md:w-12 md:h-12 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-110 transition-transform shrink-0">
                <svg class="w-5 h-5 md:w-6 md:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </div>
            <div class="flex flex-col">
                <div class="flex items-center space-x-2">
                    <h1 class="text-base md:text-xl font-black text-white tracking-widest uppercase">AI Code Masker</h1>
                    <span class="hidden sm:inline bg-indigo-500/20 text-indigo-400 text-[8px] font-black px-2 py-0.5 rounded-full uppercase">Beta</span>
                </div>
                <p class="hidden sm:block text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">Privacy-first code masking</p>
            </div>
        </div>

        <!-- Desktop Nav -->
        <nav class="desktop-nav hidden md:flex items-center space-x-6">
            <div class="flex items-center space-x-3 bg-emerald-500/5 px-3 py-1.5 rounded-xl border border-emerald-500/10">
                <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Zero Data Retention</span>
            </div>
            <a href="/" class="text-[11px] font-black uppercase tracking-[3px] {% if active_page == 'masker' %}text-white{% else %}text-slate-500 hover:text-indigo-400{% endif %} transition-all">Editor</a>
            <a href="/privacy" class="text-[11px] font-black uppercase tracking-[3px] {% if active_page == 'privacy' %}text-white{% else %}text-slate-500 hover:text-indigo-400{% endif %} transition-all">Privacy</a>
        </nav>

        <!-- Mobile Hamburger -->
        <button class="hamburger-btn items-center justify-center w-10 h-10 rounded-xl border border-white/10 text-slate-400 hover:text-white transition-all" onclick="toggleMobileNav()" aria-label="Menu">
            <svg id="ham-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <!-- Mobile Nav Dropdown -->
        <div id="mobile-nav" class="mobile-nav">
            <a href="/" class="text-sm font-black uppercase tracking-widest {% if active_page == 'masker' %}text-white{% else %}text-slate-400{% endif %}">Editor</a>
            <a href="/privacy" class="text-sm font-black uppercase tracking-widest {% if active_page == 'privacy' %}text-white{% else %}text-slate-400{% endif %}">Privacy</a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col bg-black/20">
        {% block content %}{% endblock %}
    </main>

    <script>
        window.addEventListener('load', () => {
            gsap.from("header", { y: -100, opacity: 0, duration: 0.8, ease: "power4.out" });
            gsap.from("main .content-area", { y: 30, opacity: 0, duration: 0.8, ease: "power4.out", stagger: 0.1 });
        });

        function toggleMobileNav() {
            const nav = document.getElementById('mobile-nav');
            nav.classList.toggle('open');
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>

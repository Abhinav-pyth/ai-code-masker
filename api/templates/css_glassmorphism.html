{% extends "base.html" %}
{% block title %}CSS Glassmorphism Generator{% endblock %}
{% block canonical %}https://ai-code-masker.vercel.app/css-glassmorphism{% endblock %}
{% block content %}
    <div class="h-14 border-b border-white/5 flex items-center px-8 glass shrink-0">
        <h2 class="text-xs font-black text-white tracking-[4px] uppercase">CSS Glassmorphism Generator</h2>
    </div>
    <div class="p-8 flex flex-col lg:flex-row gap-6 flex-grow overflow-auto">
        <div class="w-full lg:w-64 flex flex-col gap-3 shrink-0 glass-card rounded-2xl p-5">
            <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Blur: <span id="v-blur" class="text-indigo-400">20</span>px</label>
            <input type="range" id="g-blur" min="0" max="40" value="20" oninput="upd()" class="accent-indigo-500">
            <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Opacity: <span id="v-op" class="text-indigo-400">20</span>%</label>
            <input type="range" id="g-op" min="0" max="100" value="20" oninput="upd()" class="accent-indigo-500">
            <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Saturation: <span id="v-sat" class="text-indigo-400">180</span>%</label>
            <input type="range" id="g-sat" min="100" max="300" value="180" oninput="upd()" class="accent-indigo-500">
            <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Border Opacity: <span id="v-bo" class="text-indigo-400">10</span>%</label>
            <input type="range" id="g-bo" min="0" max="50" value="10" oninput="upd()" class="accent-indigo-500">
            <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Border Radius: <span id="v-br" class="text-indigo-400">16</span>px</label>
            <input type="range" id="g-br" min="0" max="50" value="16" oninput="upd()" class="accent-indigo-500">
            <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Color</label>
            <input type="color" id="g-color" value="#ffffff" oninput="upd()" class="w-full h-8 rounded cursor-pointer border-0 bg-transparent">
        </div>
        <div class="flex-1 flex flex-col gap-4">
            <div class="flex-1 flex items-center justify-center rounded-2xl min-h-[350px] relative" style="background:linear-gradient(135deg,#667eea,#764ba2);">
                <div class="absolute inset-0 flex flex-wrap gap-6 p-8 opacity-30">
                    <div class="w-24 h-24 rounded-full bg-pink-400"></div>
                    <div class="w-32 h-20 rounded-xl bg-yellow-300 mt-12"></div>
                    <div class="w-20 h-28 rounded-2xl bg-cyan-400 mt-4"></div>
                </div>
                <div id="glass-box" class="relative z-10 w-72 h-48 flex items-center justify-center transition-all duration-200">
                    <p class="text-white text-center font-bold text-lg">Glassmorphism</p>
                </div>
            </div>
            <div class="glass-card rounded-2xl p-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">CSS Code</span>
                    <button onclick="navigator.clipboard.writeText(document.getElementById('glass-code').textContent)" class="text-[10px] text-indigo-400 hover:text-white transition-all">Copy</button>
                </div>
                <code id="glass-code" class="code-font text-xs text-indigo-300 block whitespace-pre"></code>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
<script>
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function upd(){
    const blur=document.getElementById('g-blur').value,op=document.getElementById('g-op').value,sat=document.getElementById('g-sat').value;
    const bo=document.getElementById('g-bo').value,br=document.getElementById('g-br').value;
    const c=hexToRgb(document.getElementById('g-color').value);
    document.getElementById('v-blur').textContent=blur;document.getElementById('v-op').textContent=op;
    document.getElementById('v-sat').textContent=sat;document.getElementById('v-bo').textContent=bo;document.getElementById('v-br').textContent=br;
    const box=document.getElementById('glass-box');
    box.style.background=`rgba(${c.r},${c.g},${c.b},${op/100})`;
    box.style.backdropFilter=`blur(${blur}px) saturate(${sat}%)`;
    box.style.webkitBackdropFilter=`blur(${blur}px) saturate(${sat}%)`;
    box.style.border=`1px solid rgba(255,255,255,${bo/100})`;
    box.style.borderRadius=br+'px';
    document.getElementById('glass-code').textContent=`background: rgba(${c.r}, ${c.g}, ${c.b}, ${(op/100).toFixed(2)});\nbackdrop-filter: blur(${blur}px) saturate(${sat}%);\n-webkit-backdrop-filter: blur(${blur}px) saturate(${sat}%);\nborder: 1px solid rgba(255, 255, 255, ${(bo/100).toFixed(2)});\nborder-radius: ${br}px;`;
}
upd();
</script>
{% endblock %}

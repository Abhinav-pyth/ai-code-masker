{% extends "base.html" %}
{% block title %}RGBA to HEX Converter{% endblock %}
{% block canonical %}https://ai-code-masker.vercel.app/rgba-to-hex{% endblock %}
{% block content %}
    <div class="h-14 border-b border-white/5 flex items-center px-8 glass shrink-0">
        <h2 class="text-xs font-black text-white tracking-[4px] uppercase">RGBA to HEX Converter</h2>
    </div>
    <div class="p-8 flex flex-col gap-6 flex-grow overflow-auto">
        <div class="glass-card rounded-2xl p-6">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div><label class="text-[10px] font-black text-red-400 uppercase block mb-1">R</label><input type="number" id="rth-r" min="0" max="255" value="99" oninput="convert()" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none"></div>
                <div><label class="text-[10px] font-black text-green-400 uppercase block mb-1">G</label><input type="number" id="rth-g" min="0" max="255" value="102" oninput="convert()" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none"></div>
                <div><label class="text-[10px] font-black text-blue-400 uppercase block mb-1">B</label><input type="number" id="rth-b" min="0" max="255" value="241" oninput="convert()" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none"></div>
                <div><label class="text-[10px] font-black text-slate-400 uppercase block mb-1">A</label><input type="number" id="rth-a" min="0" max="1" step="0.01" value="1" oninput="convert()" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none"></div>
            </div>
        </div>
        <div class="glass-card rounded-2xl p-6">
            <div class="flex justify-between items-center mb-3">
                <span class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">HEX Output</span>
                <button onclick="navigator.clipboard.writeText(document.getElementById('rth-output').value)" class="text-[10px] text-indigo-400 hover:text-white transition-all">Copy</button>
            </div>
            <input id="rth-output" readonly type="text" class="w-full bg-slate-950/40 rounded-lg px-4 py-3 text-lg text-indigo-300 outline-none code-font">
        </div>
        <div id="rth-preview" class="h-32 rounded-2xl border border-white/10 transition-all"></div>
    </div>
{% endblock %}
{% block scripts %}
<script>
function convert(){
    const r=Math.min(255,Math.max(0,+document.getElementById('rth-r').value||0));
    const g=Math.min(255,Math.max(0,+document.getElementById('rth-g').value||0));
    const b=Math.min(255,Math.max(0,+document.getElementById('rth-b').value||0));
    const a=Math.min(1,Math.max(0,+document.getElementById('rth-a').value||0));
    const hex6='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    const hex8=hex6+Math.round(a*255).toString(16).padStart(2,'0');
    document.getElementById('rth-output').value=a<1?hex8:hex6;
    document.getElementById('rth-preview').style.background=`rgba(${r},${g},${b},${a})`;
}
convert();
</script>
{% endblock %}

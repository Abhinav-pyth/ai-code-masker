{% extends "base.html" %}
{% block title %}{{ seo.title }}{% endblock %}
{% block meta_description %}{{ seo.description }}{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8">
    <div class="glass-card p-6 md:p-8 rounded-3xl border border-border mb-6">
        <h1 class="text-2xl font-black text-textMain uppercase tracking-tight" style="font-family:'Outfit',sans-serif">Unix Timestamp Converter</h1>
        <p class="text-sm text-textDim mt-2 max-w-2xl leading-relaxed">{{ tool_intro }}</p>

        <label class="block mt-5"><span class="text-[10px] font-black uppercase tracking-widest text-textDim">Timestamp or ISO date</span><input id="ts-in" type="text" placeholder="now" value="" class="w-full mt-1 px-4 py-3 bg-black/5 dark:bg-black/40 border border-border rounded-xl text-textMain focus:outline-none focus:ring-2 focus:ring-primary transition-all font-mono text-sm"></label><button id="ts-btn" class="btn-glow px-6 py-3 rounded-xl text-white font-black text-xs uppercase tracking-widest w-full sm:w-auto mt-5">Convert</button><pre id="ts-out" class="mt-5 p-4 rounded-xl overflow-x-auto text-xs font-mono whitespace-pre-wrap break-all" style="background:#0b1020;color:#a5f3fc;border:1px solid #1e293b;min-height:44px">—</pre>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fmt(d){const z=n=>String(n).padStart(2,'0');return z(d.getFullYear())+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());}
function conv(){const v=document.getElementById('ts-in').value.trim();const o=document.getElementById('ts-out');let d=new Date();if(v&&v!=='now'){if(/^\d+$/.test(v)){d=new Date(v.length<=10?Number(v)*1000:Number(v));}else d=new Date(v);}
if(isNaN(d)){o.textContent='Could not parse that date/timestamp.';return;}
const diff=(Date.now()-d)/1000;const rel=diff>=0?Math.abs(diff).toFixed(0)+'s ago':'in '+diff.toFixed(0)+'s';
o.textContent='Local:      '+fmt(d)+'\nUTC:        '+d.toISOString()+'\nEpoch s:    '+Math.floor(d.getTime()/1000)+'\nEpoch ms:   '+d.getTime()+'\nRelative:   '+rel;}
document.getElementById('ts-btn').addEventListener('click',conv);document.getElementById('ts-in').addEventListener('keydown',e=>{if(e.key==='Enter')conv();});conv();
</script>
{% endblock %}

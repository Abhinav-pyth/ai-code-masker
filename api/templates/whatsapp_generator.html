{% extends "base.html" %}
{% block title %}WhatsApp Chat Generator{% endblock %}
{% block canonical %}https://ai-code-masker.vercel.app/whatsapp-generator{% endblock %}
{% block content %}
    <div class="h-14 border-b border-white/5 flex items-center px-8 glass shrink-0">
        <h2 class="text-xs font-black text-white tracking-[4px] uppercase">WhatsApp Chat Generator</h2>
    </div>
    <div class="p-8 flex flex-col lg:flex-row gap-6 flex-grow overflow-auto">
        <div class="w-full lg:w-72 shrink-0 glass-card rounded-2xl p-5 flex flex-col gap-3 overflow-auto max-h-[80vh]">
            <label class="text-[10px] font-black text-slate-500 uppercase">Contact Name</label>
            <input id="wa-name" type="text" value="Alex" oninput="render()" class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none">
            <div id="wa-msgs" class="flex flex-col gap-2"></div>
            <div class="flex gap-2">
                <button onclick="addMsg('sent')" class="flex-1 px-3 py-2 rounded-lg text-[10px] font-bold bg-emerald-600/20 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-600/40 transition-all">+ Sent</button>
                <button onclick="addMsg('received')" class="flex-1 px-3 py-2 rounded-lg text-[10px] font-bold bg-white/5 border border-white/10 text-slate-400 hover:text-white transition-all">+ Received</button>
            </div>
            <button onclick="capture()" class="mt-2 px-5 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider bg-indigo-600 text-white hover:bg-indigo-500 transition-all">📷 Download</button>
        </div>
        <div class="flex-1 flex items-start justify-center pt-4">
            <div id="wa-card" style="width:380px;border-radius:12px;overflow:hidden;font-family:-apple-system,sans-serif">
                <div style="background:#075e54;padding:12px 16px;display:flex;align-items:center;gap:10px">
                    <div style="font-size:18px">←</div>
                    <div style="width:36px;height:36px;border-radius:50%;background:#128c7e"></div>
                    <div><div id="wa-hname" style="color:#fff;font-size:16px;font-weight:600">Alex</div><div style="color:rgba(255,255,255,0.6);font-size:12px">online</div></div>
                </div>
                <div id="wa-chat" style="background:#ece5dd;padding:16px 12px;min-height:300px;display:flex;flex-direction:column;gap:4px;background-image:url('data:image/svg+xml,%3Csvg width=\'200\' height=\'200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M0 0h200v200H0z\' fill=\'%23d9d2c5\' fill-opacity=\'.1\'/%3E%3C/svg%3E')"></div>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let messages=[{type:'received',text:'Hey! How are you?'},{type:'sent',text:'I\'m great! Thanks 😊'},{type:'received',text:'Want to grab coffee?'},{type:'sent',text:'Sure! Let\'s go ☕'}];
function render(){
    document.getElementById('wa-hname').textContent=document.getElementById('wa-name').value;
    const chat=document.getElementById('wa-chat');const now=new Date();const time=now.getHours()+':'+now.getMinutes().toString().padStart(2,'0');
    chat.innerHTML=messages.map(m=>`<div style="align-self:${m.type==='sent'?'flex-end':'flex-start'};background:${m.type==='sent'?'#dcf8c6':'#fff'};padding:6px 10px;border-radius:8px;max-width:75%;font-size:14px;color:#303030;position:relative"><span>${m.text}</span><span style="font-size:10px;color:#999;margin-left:8px;float:right;margin-top:4px">${time}${m.type==='sent'?' ✓✓':''}</span></div>`).join('');
    const ctrl=document.getElementById('wa-msgs');ctrl.innerHTML=messages.map((m,i)=>`<div class="flex gap-1 items-center"><input type="text" value="${m.text}" onchange="messages[${i}].text=this.value;render()" class="flex-grow bg-white/5 border border-white/10 rounded px-2 py-1 text-[10px] text-white outline-none"><button onclick="messages.splice(${i},1);render()" class="text-red-400 text-xs">✕</button></div>`).join('');
}
function addMsg(type){messages.push({type,text:'New message'});render();}
function capture(){html2canvas(document.getElementById('wa-card'),{scale:2}).then(c=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='whatsapp-chat.png';a.click();});}
render();
</script>
{% endblock %}

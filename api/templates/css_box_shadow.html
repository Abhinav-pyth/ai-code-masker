{% extends "base.html" %}
{% block title %}CSS Box Shadow Generator{% endblock %}
{% block canonical %}https://ai-code-masker.vercel.app/css-box-shadow{% endblock %}
{% block content %}
    <div class="h-14 border-b border-white/5 flex items-center px-8 glass shrink-0">
        <h2 class="text-xs font-black text-white tracking-[4px] uppercase">CSS Box Shadow Generator</h2>
    </div>
    <div class="p-8 flex flex-col lg:flex-row gap-6 flex-grow overflow-auto">
        <div class="w-full lg:w-72 flex flex-col gap-4 shrink-0">
            <div class="glass-card rounded-2xl p-5 flex flex-col gap-3">
                <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Horizontal: <span id="v-x" class="text-indigo-400">10</span>px</label>
                <input type="range" id="s-x" min="-100" max="100" value="10" oninput="upd()" class="accent-indigo-500">
                <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Vertical: <span id="v-y" class="text-indigo-400">10</span>px</label>
                <input type="range" id="s-y" min="-100" max="100" value="10" oninput="upd()" class="accent-indigo-500">
                <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Blur: <span id="v-b" class="text-indigo-400">20</span>px</label>
                <input type="range" id="s-b" min="0" max="200" value="20" oninput="upd()" class="accent-indigo-500">
                <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Spread: <span id="v-s" class="text-indigo-400">0</span>px</label>
                <input type="range" id="s-s" min="-100" max="100" value="0" oninput="upd()" class="accent-indigo-500">
                <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Color</label>
                <input type="color" id="s-c" value="#6366f1" oninput="upd()" class="w-full h-8 rounded cursor-pointer border-0 bg-transparent">
                <label class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">Opacity: <span id="v-o" class="text-indigo-400">40</span>%</label>
                <input type="range" id="s-o" min="0" max="100" value="40" oninput="upd()" class="accent-indigo-500">
                <label class="flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                    <input type="checkbox" id="s-inset" onchange="upd()" class="accent-indigo-500"> Inset
                </label>
            </div>
        </div>
        <div class="flex-1 flex flex-col gap-4">
            <div class="flex-1 flex items-center justify-center glass-card rounded-2xl p-8 min-h-[300px]">
                <div id="shadow-box" class="w-48 h-48 rounded-2xl bg-white/10 border border-white/10 transition-all duration-200"></div>
            </div>
            <div class="glass-card rounded-2xl p-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-black text-slate-500 tracking-[3px] uppercase">CSS Code</span>
                    <button onclick="navigator.clipboard.writeText(document.getElementById('shadow-code').textContent)" class="text-[10px] text-indigo-400 hover:text-white transition-all">Copy</button>
                </div>
                <code id="shadow-code" class="code-font text-sm text-indigo-300 block"></code>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
<script>
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b};}
function upd(){
    const x=document.getElementById('s-x').value,y=document.getElementById('s-y').value,b=document.getElementById('s-b').value,s=document.getElementById('s-s').value;
    const c=hexToRgb(document.getElementById('s-c').value),o=document.getElementById('s-o').value/100;
    const inset=document.getElementById('s-inset').checked;
    document.getElementById('v-x').textContent=x;document.getElementById('v-y').textContent=y;
    document.getElementById('v-b').textContent=b;document.getElementById('v-s').textContent=s;
    document.getElementById('v-o').textContent=document.getElementById('s-o').value;
    const css=`${inset?'inset ':''}${x}px ${y}px ${b}px ${s}px rgba(${c.r}, ${c.g}, ${c.b}, ${o})`;
    document.getElementById('shadow-box').style.boxShadow=css;
    document.getElementById('shadow-code').textContent=`box-shadow: ${css};`;
}
upd();
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ seo.title }}{% endblock %}
{% block meta_description %}{{ seo.description }}{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8">
    <div class="glass-card p-6 md:p-8 rounded-3xl border border-border mb-6">
        <h1 class="text-2xl font-black text-textMain uppercase tracking-tight" style="font-family:'Outfit',sans-serif">Regex Tester</h1>
        <p class="text-sm text-textDim mt-2 max-w-2xl leading-relaxed">{{ tool_intro }}</p>

        <label class="block mt-5"><span class="text-[10px] font-black uppercase tracking-widest text-textDim">Pattern (no delimiters)</span><input id="re-pattern" type="text" placeholder="\b\w+@\w+\.\w+\b" value="" class="w-full mt-1 px-4 py-3 bg-black/5 dark:bg-black/40 border border-border rounded-xl text-textMain focus:outline-none focus:ring-2 focus:ring-primary transition-all font-mono text-sm"></label><label class="block mt-5"><span class="text-[10px] font-black uppercase tracking-widest text-textDim">Test string</span><textarea id="re-text" rows="5" placeholder="Paste sample text here..." class="w-full mt-1 px-4 py-3 border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary transition-all font-mono text-sm" style="background:#0b1020;color:#e2e8f0"></textarea></label><label class="block mt-5"><span class="text-[10px] font-black uppercase tracking-widest text-textDim">Replacement (optional)</span><input id="re-repl" type="text" placeholder="[$&]" value="" class="w-full mt-1 px-4 py-3 bg-black/5 dark:bg-black/40 border border-border rounded-xl text-textMain focus:outline-none focus:ring-2 focus:ring-primary transition-all font-mono text-sm"></label><div class="flex gap-4 mt-3 text-xs text-textDim"><label class="inline-flex items-center gap-2"><input type="checkbox" id="re-g" checked class="accent-indigo-500">g</label><label class="inline-flex items-center gap-2"><input type="checkbox" id="re-i" class="accent-indigo-500">i</label><label class="inline-flex items-center gap-2"><input type="checkbox" id="re-m" class="accent-indigo-500">m</label></div><pre id="re-out" class="mt-5 p-4 rounded-xl overflow-x-auto text-xs font-mono whitespace-pre-wrap break-all" style="background:#0b1020;color:#a5f3fc;border:1px solid #1e293b;min-height:44px">—</pre>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function run(){const p=document.getElementById('re-pattern').value,t=document.getElementById('re-text').value,f=(document.getElementById('re-g').checked?'g':'')+(document.getElementById('re-i').checked?'i':'')+(document.getElementById('re-m').checked?'m':'');const o=document.getElementById('re-out');if(!p){o.textContent='—';return;}
try{const re=new RegExp(p,f);let m,n=0,h='',last=0;while((m=re.exec(t))!==null){n++;h+=esc(t.slice(last,m.index))+'<mark style="background:#6366f1;color:#fff">'+esc(m[0])+'</mark>';last=m.index+m[0].length;if(m[0]==='')re.lastIndex++;}
h+=esc(t.slice(last));const rp=document.getElementById('re-repl').value||'';const repl=f.includes('g')?t.replace(re,rp):t.replace(new RegExp(p,f.replace('g','')),rp);
o.innerHTML='<b style="color:#f472b6">'+n+' match'+(n===1?'':'es')+'</b><br>'+(h||'<i style="color:#64748b">no matches — highlighted text appears here</i>')+'<br><br><b style="color:#f472b6">Replacement preview:</b><br>'+esc(repl);}catch(e){o.innerHTML='<b style="color:#ef4444">Invalid pattern:</b> '+esc(e.message);}}
['re-pattern','re-text','re-repl','re-g','re-i','re-m'].forEach(i=>document.getElementById(i).addEventListener('input',run));
</script>
{% endblock %}
